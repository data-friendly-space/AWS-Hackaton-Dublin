<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <!-- Background -->
  <rect width="800" height="500" fill="#f8faf9"/>

  <!-- Service User Node -->
  <g transform="translate(100, 200)">
    <rect x="0" y="0" width="140" height="80" rx="12" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="2"/>
    <text x="70" y="35" text-anchor="middle" fill="#0c4a6e" font-family="system-ui" font-size="14" font-weight="600">Pregnant Women</text>
    <text x="70" y="55" text-anchor="middle" fill="#0ea5e9" font-family="system-ui" font-size="11">Service User</text>
  </g>

  <!-- Service Provider Node -->
  <g transform="translate(330, 80)">
    <rect x="0" y="0" width="140" height="80" rx="12" fill="#dcfce7" stroke="#006e33" stroke-width="2"/>
    <text x="70" y="35" text-anchor="middle" fill="#04371b" font-family="system-ui" font-size="14" font-weight="600">Health Center</text>
    <text x="70" y="55" text-anchor="middle" fill="#006e33" font-family="system-ui" font-size="11">Service Provider</text>
  </g>

  <!-- Another Service Provider -->
  <g transform="translate(330, 320)">
    <rect x="0" y="0" width="140" height="80" rx="12" fill="#dcfce7" stroke="#006e33" stroke-width="2"/>
    <text x="70" y="35" text-anchor="middle" fill="#04371b" font-family="system-ui" font-size="14" font-weight="600">CHW</text>
    <text x="70" y="55" text-anchor="middle" fill="#006e33" font-family="system-ui" font-size="11">Service Provider</text>
  </g>

  <!-- Support Node -->
  <g transform="translate(560, 200)">
    <rect x="0" y="0" width="140" height="80" rx="12" fill="#f3e8ff" stroke="#8b5cf6" stroke-width="2"/>
    <text x="70" y="35" text-anchor="middle" fill="#4c1d95" font-family="system-ui" font-size="14" font-weight="600">NGO Partner</text>
    <text x="70" y="55" text-anchor="middle" fill="#8b5cf6" font-family="system-ui" font-size="11">Support</text>
  </g>

  <!-- Regulatory Node -->
  <g transform="translate(560, 80)">
    <rect x="0" y="0" width="140" height="80" rx="12" fill="#ffedd5" stroke="#f97316" stroke-width="2"/>
    <text x="70" y="35" text-anchor="middle" fill="#7c2d12" font-family="system-ui" font-size="14" font-weight="600">Ministry of Health</text>
    <text x="70" y="55" text-anchor="middle" fill="#f97316" font-family="system-ui" font-size="11">Regulatory</text>
  </g>

  <!-- Connection Lines -->
  <!-- User to Health Center - Good -->
  <path d="M240 240 Q285 160 330 120" stroke="#22c55e" stroke-width="3" fill="none" marker-end="url(#arrowGood)"/>

  <!-- User to CHW - Stressed -->
  <path d="M240 240 Q285 320 330 360" stroke="#eab308" stroke-width="3" fill="none" stroke-dasharray="8,4" marker-end="url(#arrowStressed)"/>

  <!-- Health Center to Ministry -->
  <path d="M470 120 L560 120" stroke="#22c55e" stroke-width="2" fill="none" marker-end="url(#arrowGood)"/>

  <!-- NGO to Health Center -->
  <path d="M560 240 Q515 160 470 120" stroke="#22c55e" stroke-width="2" fill="none" marker-end="url(#arrowGood)"/>

  <!-- NGO to CHW -->
  <path d="M560 240 Q515 320 470 360" stroke="#22c55e" stroke-width="2" fill="none" marker-end="url(#arrowGood)"/>

  <!-- Arrow markers -->
  <defs>
    <marker id="arrowGood" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#22c55e"/>
    </marker>
    <marker id="arrowStressed" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#eab308"/>
    </marker>
  </defs>

  <!-- Legend -->
  <g transform="translate(50, 430)">
    <text x="0" y="0" fill="#374151" font-family="system-ui" font-size="12" font-weight="600">Relationship Quality:</text>
    <line x1="130" y1="-4" x2="160" y2="-4" stroke="#22c55e" stroke-width="3"/>
    <text x="165" y="0" fill="#374151" font-family="system-ui" font-size="11">Good</text>
    <line x1="210" y1="-4" x2="240" y2="-4" stroke="#eab308" stroke-width="3" stroke-dasharray="8,4"/>
    <text x="245" y="0" fill="#374151" font-family="system-ui" font-size="11">Stressed</text>
    <line x1="300" y1="-4" x2="330" y2="-4" stroke="#ef4444" stroke-width="3" stroke-dasharray="4,4"/>
    <text x="335" y="0" fill="#374151" font-family="system-ui" font-size="11">Bad</text>
  </g>
</svg>
